[project]
name = "polyclaude"
version = "0.1.0"
description = "Polymarket trading agent with Claude as a calibrated probability oracle"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "py-clob-client>=0.17",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "tenacity>=8.4",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "structlog>=24.1",
    "vaderSentiment>=3.3",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.42",
    "torch>=2.3",
    "sentence-transformers>=2.7",
]
audio = [
    "faster-whisper>=1.0",
]
ui = [
    "streamlit>=1.36",
    "matplotlib>=3.9",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
polyclaude = "polyclaude.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyclaude*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
