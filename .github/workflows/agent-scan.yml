name: agent-scan

# GitHub-only deployment: this Action is the agent. It runs polyclaude scan
# every 10 minutes (configurable below), pulls news, scores via Claude, places
# orders in dry-run by default, and writes everything to your hosted Turso DB.
#
# To enable, set these repo secrets in
#   Settings → Secrets and variables → Actions:
#
#   DATABASE_URL          (Turso URL incl. authToken)
#   ANTHROPIC_API_KEY     (Claude oracle)
#   PRIVATE_KEY           (only needed for --live; leave unset for dry-run)
#   FUNDER                (Polygon address; only needed for --live)
#
# To go live, change `polyclaude scan` to `polyclaude trade --live --max-notional 25
# --yes-i-am-sure` below — but only after the dashboard's "Live status" tab says
# Brier ≤ 0.20 over ≥ 100 resolved markets.

on:
  # Hourly. With --limit 6 and the ambiguity cache we stay under
  # 150 Claude calls/day in steady state:
  #   day-1 worst case: 6 markets × 2 calls × 24 hours = 288 (cold cache)
  #   steady state: 6 markets × 1 call (probability only, ambiguity cached)
  #                  × 24 hours = 144
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: agent-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25         # well above the worst-case scan + install time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-agent.txt
      - name: Initialise schema (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m polyclaude.main init
      - name: Run scan (dry-run)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FUNDER: ${{ secrets.FUNDER }}
          DRY_RUN: "true"
          MAX_NOTIONAL_PER_DAY: "25"
        # 6 markets × ≤2 Claude calls each ≈ 1–2 min in steady state.
        # The ambiguity cache (24 h) makes most calls into single-call scans
        # after the first run, keeping daily total ≤150.
        run: python -m polyclaude.main scan --limit 6
