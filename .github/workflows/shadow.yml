name: shadow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Initialise empty ledger
        run: |
          python -m polyclaude.main init
      - name: Run shadow re-score
        env:
          # In a real deployment these point at the production Turso DB
          # so we can score against the actual resolved-markets ledger.
          DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL || 'sqlite:///./data/polyclaude.sqlite' }}
        run: |
          python -m polyclaude.main shadow --days 7 --baseline 0.20
